name: Deploy static assets

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print({k: c.get(k) for k in ['iss', 'aud', 'sub', 'repository', 'ref']})
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::606025553712:role/dharshanya-assets-prod-4821-github-deploy
          aws-region: ap-south-1

      # Hashed/static assets: cache for 1 year
      - name: Sync immutable assets
        run: |
          aws s3 sync site/ s3://${{ vars.S3_BUCKET }} \
            --delete --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      # HTML: short cache so changes show up quickly
      - name: Sync HTML
        run: |
          aws s3 sync site/ s3://${{ vars.S3_BUCKET }} \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=60"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/index.html" "/404.html" "/*.html"