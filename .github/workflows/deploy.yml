name: Deploy static assets

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: arn:aws:iam::606025553712:role/dharshanya-assets-prod-4821-github-deploy
          aws-region: ap-south-1

      # Hashed/static assets: cache for 1 year
      - name: Sync immutable assets
        run: |
          aws s3 sync site/ s3://${{ vars.S3_BUCKET }} \
            --delete --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      # HTML: short cache so changes show up quickly
      - name: Sync HTML
        run: |
          aws s3 sync site/ s3://${{ vars.S3_BUCKET }} \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=60"

      # Only HTML needs invalidating if asset filenames are content-hashed.
      # If you don't hash filenames, change paths to "/*".
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/index.html" "/404.html" "/*.html"
